<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FakeMerchant — three-tier checkout</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; color: #1f2937; }
        h1 { font-size: 1.5rem; }
        label { display: block; margin: 0.5rem 0 0.25rem; font-weight: 500; }
        input, button { padding: 0.6rem 0.8rem; font-size: 1rem; border-radius: 6px; border: 1px solid #d1d5db; }
        input { width: 100%; box-sizing: border-box; }
        button { background: #16a34a; color: #fff; border: none; cursor: pointer; }
        pre { background: #f3f4f6; padding: 12px; border-radius: 6px; overflow-x: auto; max-height: 500px; }
        .ok { color: #047857; }
        .err { color: #b91c1c; }
        .pending { color: #b45309; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; }
        nav a { color: #16a34a; margin-right: 1rem; }
    </style>
</head>
<body>
<nav><a href="/">← FakeMerchant home</a><a href="http://localhost:8001/">FakeBank →</a></nav>

<h1>Pay with SPC (back-channel async)</h1>

<form id="pay-form">
    <div class="row">
        <div>
            <label for="username">Cardholder username</label>
            <input id="username" name="username" type="email" required value="jane.doe@example.com">
        </div>
        <div>
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="text" required value="99.99">
        </div>
        <div>
            <label for="currency">Currency</label>
            <input id="currency" name="currency" type="text" required value="USD" maxlength="3">
        </div>
    </div>
    <p><button type="submit">Pay</button></p>
</form>

<h2>Output</h2>
<pre id="output">Submit the form to start an SPC payment.</pre>

<script type="module">
    const BACK = 'http://localhost:8003';

    const out = document.getElementById('output');
    const form = document.getElementById('pay-form');
    const b64uToBuffer = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(s.length + (4 - s.length % 4) % 4, '=')), c => c.charCodeAt(0)).buffer;
    const bufferToB64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const log = (msg, cls = '') => {
        const stamp = new Date().toISOString().slice(11, 19);
        out.innerHTML += `\n<span class="${cls}">[${stamp}] ${msg}</span>`;
    };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    if (!('PaymentRequest' in window)) {
        log('✗ Payment Request API not available in this browser.', 'err');
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        out.textContent = '';
        const body = {
            username: form.username.value.trim(),
            amount: form.amount.value.trim(),
            currency: form.currency.value.trim(),
            transactionId: 'ORD-' + Math.random().toString(36).slice(2, 10),
        };
        try {
            log(`[browser→merchant-back] POST ${BACK}/api/payment/options`);
            const optsRes = await fetch(`${BACK}/api/payment/options`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const opts = await optsRes.json();
            if (!optsRes.ok) throw new Error(opts.error || `options returned ${optsRes.status}`);
            log(`[merchant-back→browser] challenge for transactionId=${opts.transactionId}, ${opts.credentialIds.length} credentialId(s).`);

            const supportedMethods = [{
                supportedMethods: 'secure-payment-confirmation',
                data: {
                    rpId: opts.rpId,
                    credentialIds: opts.credentialIds.map(b64uToBuffer),
                    challenge: b64uToBuffer(opts.challenge),
                    instrument: opts.instrument,
                    payeeName: opts.payeeName,
                    payeeOrigin: opts.payeeOrigin,
                    timeout: opts.timeout,
                },
            }];
            const details = {
                total: { label: 'Total', amount: { currency: opts.total.currency, value: opts.total.value } },
            };

            log('Calling PaymentRequest.show() — confirm in the browser dialog…');
            const response = await new PaymentRequest(supportedMethods, details).show();
            await response.complete('success');

            const credential = response.details;
            const credentialPayload = {
                id: credential.id,
                rawId: bufferToB64u(credential.rawId),
                type: credential.type,
                response: {
                    clientDataJSON: bufferToB64u(credential.response.clientDataJSON),
                    authenticatorData: bufferToB64u(credential.response.authenticatorData),
                    signature: bufferToB64u(credential.response.signature),
                    userHandle: credential.response.userHandle ? bufferToB64u(credential.response.userHandle) : null,
                },
                clientExtensionResults: credential.getClientExtensionResults?.() ?? {},
            };

            // Submit the assertion to the merchant backend. The backend
            // parks it as PENDING and returns immediately — the bank
            // round-trip will happen lazily on /status polls.
            log(`[browser→merchant-back] POST ${BACK}/api/payment/submit (no immediate verification)`, 'ok');
            const submitRes = await fetch(`${BACK}/api/payment/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ transactionId: opts.transactionId, credential: credentialPayload }),
            });
            const submitJson = await submitRes.json();
            if (!submitRes.ok) throw new Error(submitJson.error || `submit returned ${submitRes.status}`);
            log(`[merchant-back→browser] ${submitJson.status} — ${submitJson.message}`, 'pending');

            // Poll for the bank's verdict.
            for (let attempt = 1; attempt <= 30; attempt++) {
                await sleep((submitJson.pollEverySeconds ?? 1) * 1000);
                log(`[browser→merchant-back] GET /api/payment/status?txn=${opts.transactionId}  (attempt ${attempt})`);
                const statusRes = await fetch(`${BACK}/api/payment/status?txn=${encodeURIComponent(opts.transactionId)}`);
                const statusJson = await statusRes.json();
                if (statusJson.status === 'PENDING') {
                    log(`[merchant-back→browser] still PENDING (back-channel hasn't answered yet)…`, 'pending');
                    continue;
                }
                if (statusJson.status === 'APPROVED') {
                    log(`[merchant-back→browser] ✔ APPROVED — ARes received from FakeBank`, 'ok');
                    log('Bank ARes:');
                    log(JSON.stringify(statusJson.bankResponse, null, 2));
                    return;
                }
                throw new Error(`Bank declined: ${statusJson.error ?? 'unknown'}`);
            }
            log('✗ Polling timed out.', 'err');
        } catch (e) {
            log(`✗ ${e.message}`, 'err');
            console.error(e);
        }
    });
</script>
</body>
</html>
