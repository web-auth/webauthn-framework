name: Publish NPM Package

on:
  # `push.tags` does NOT fire when the tag is created through GitHub's
  # "Create a release" UI (only `release.*` events do). We subscribe to
  # both so the package is published whether the tag is pushed from a
  # git client or created via a milestone-driven release.
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  # Manual fallback: backfill a missed publish or republish a specific
  # version. The `version` input wins over GITHUB_REF when set.
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 5.3.0). Defaults to GITHUB_REF when empty."
        required: false
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        # Node 24 ships npm >= 11.5.1, required for Trusted Publisher (OIDC).
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Install dependencies
        # npm install (not npm ci) — package-lock.json is gitignored so the
        # lock file does not exist in CI.
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Update package version
        working-directory: ./src/stimulus/assets
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version
          echo "Updated package.json to version ${{ steps.get_version.outputs.version }}"

      - name: Publish to NPM
        # Authenticates via npm Trusted Publisher (OIDC). The job's
        # `id-token: write` permission and the matching trusted-publisher
        # configuration on npmjs (web-auth/webauthn-framework +
        # npm-publish.yml) are all that is needed — no NPM token.
        working-directory: ./src/stimulus/assets
        run: npm publish --provenance

      - name: Create GitHub Release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `@web-auth/webauthn-stimulus v${version}`,
              body: `Published version ${version} to NPM: https://www.npmjs.com/package/@web-auth/webauthn-stimulus/v/${version}`,
              draft: false,
              prerelease: version.includes('-')
            });
