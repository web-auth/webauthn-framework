name: Publish NPM Package

on:
  # `push.tags` does NOT fire when the tag is created through GitHub's
  # "Create a release" UI (only `release.*` events do). We subscribe to
  # both so the package is published whether the tag is pushed from a
  # git client or created via a milestone-driven release.
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  # Manual fallback: backfill a missed publish or republish a specific
  # version. The `version` input wins over GITHUB_REF when set.
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 5.3.0). Defaults to GITHUB_REF when empty."
        required: false
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create/update the GitHub Release
      id-token: write   # for npm Trusted Publisher (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        # Node 24 ships npm >= 11.5.1, required for Trusted Publisher (OIDC).
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: get_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Install dependencies
        # npm install (not npm ci): package-lock.json is not tracked, so no
        # lock file exists in CI.
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Skip if version already on npm
        id: already_published
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if npm view "@web-auth/webauthn-stimulus@${VERSION}" version >/dev/null 2>&1; then
            echo "@web-auth/webauthn-stimulus@${VERSION} is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update package version
        if: steps.already_published.outputs.skip == 'false'
        working-directory: ./src/stimulus/assets
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version
          echo "Updated package.json to version ${{ steps.get_version.outputs.version }}"

      - name: Publish to NPM
        if: steps.already_published.outputs.skip == 'false'
        # Authenticates via npm Trusted Publisher (OIDC). The job's
        # `id-token: write` permission and the matching trusted-publisher
        # configuration on npmjs (web-auth/webauthn-framework +
        # npm-publish.yml) are all that is needed — no NPM token.
        working-directory: ./src/stimulus/assets
        run: npm publish --provenance

      - name: Ensure GitHub Release exists
        # Idempotent: a release for this tag may already exist (created when
        # the milestone was closed, or on a previous workflow_dispatch
        # backfill). In that case we simply append a note about the npm
        # publish to the existing body.
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.get_version.outputs.version }}';
            const tag = version;
            const npmNote = `Published @web-auth/webauthn-stimulus to NPM: https://www.npmjs.com/package/@web-auth/webauthn-stimulus/v/${version}`;
            const isPrerelease = version.includes('-');

            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `@web-auth/webauthn-stimulus v${version}`,
                body: npmNote,
                draft: false,
                prerelease: isPrerelease,
              });
              core.info(`Created release for ${tag}`);
            } catch (err) {
              if (err.status !== 422) throw err;
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              if ((existing.data.body || '').includes(npmNote)) {
                core.info(`Release ${tag} already mentions the npm publish — nothing to do.`);
                return;
              }
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                body: `${existing.data.body || ''}\n\n${npmNote}`.trim(),
              });
              core.info(`Appended npm-publish note to existing release ${tag}`);
            }
